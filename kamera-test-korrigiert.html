<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR Kameratest – Kamerabild</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent !important; font-family:system-ui,sans-serif; }
    /* MindAR fuegt das Kameravideo in die Szene ein. Es muss vor dem Seitenhintergrund,
       aber hinter dem transparenten WebGL-Canvas liegen. */
    a-scene { position:fixed !important; inset:0; width:100%; height:100%; background:transparent !important; }
    a-scene video, video { position:absolute !important; z-index:0 !important; visibility:visible !important; opacity:1 !important; }
    a-scene canvas, canvas.a-canvas { position:absolute !important; z-index:1 !important; background:transparent !important; }
    #status { position:fixed; z-index:9999; top:calc(env(safe-area-inset-top, 0px) + 12px); left:12px; right:12px; background:rgba(6,37,50,.92); color:#fff; padding:12px; border-radius:12px; text-align:center; font-size:14px; }
    #diagnose { position:fixed; z-index:9999; bottom:calc(env(safe-area-inset-bottom, 0px) + 12px); left:12px; right:12px; background:rgba(0,0,0,.75); color:white; padding:9px; border-radius:8px; font-size:12px; }
  </style>
</head>
<body>
  <div id="status">Kameratest wird gestartet …</div>
  <div id="diagnose">Kamerastatus wird geprüft …</div>
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: yes; uiError: yes"
           renderer="alpha: true; antialias: true" vr-mode-ui="enabled: false"
           device-orientation-permission-ui="enabled: false" embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane color="#21db85" width=".16" height=".16" position=".281 -.238 .02"
               material="side: double; opacity: .85; transparent: true"></a-plane>
    </a-entity>
  </a-scene>
  <script>
    const statusEl = document.querySelector('#status');
    const diagEl = document.querySelector('#diagnose');
    const scene = document.querySelector('a-scene');
    scene.addEventListener('arReady', () => {
      statusEl.textContent = 'Kamera gestartet. Ist die echte Umgebung sichtbar?';
      diagnose();
    });
    scene.addEventListener('arError', () => statusEl.textContent = 'Kamerastart fehlgeschlagen. Bitte Kameraberechtigung prüfen.');
    document.querySelector('#target').addEventListener('targetFound', () => statusEl.textContent = 'Postkarte erkannt! Grünes Quadrat sollte erscheinen.');
    document.querySelector('#target').addEventListener('targetLost', () => statusEl.textContent = 'Postkarte nicht erkannt. Ist die Umgebung sichtbar?');
    function diagnose() {
      const videos = [...document.querySelectorAll('video')];
      const v = videos.find(v => v.videoWidth > 0) || videos[0];
      diagEl.textContent = v
        ? `Kameravideo: ${v.videoWidth} × ${v.videoHeight} | bereit: ${v.readyState} | spielt: ${!v.paused} | Videos: ${videos.length}`
        : 'Kein Kamera-Videoelement gefunden';
    }
    document.addEventListener('visibilitychange', diagnose);
    setInterval(diagnose, 2000);
  </script>
</body>
</html>
