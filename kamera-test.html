<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR Kameratest</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#222;font-family:system-ui}#status{position:fixed;z-index:999;top:env(safe-area-inset-top,20px);left:12px;right:12px;background:#062532e8;color:white;padding:14px;border-radius:12px;text-align:center;font-size:15px}a-scene{position:absolute;inset:0}</style></head><body><div id="status">Kameratest wird gestartet …</div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no; uiLoading: yes; uiError: yes" renderer="alpha: true; antialias: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-plane color="#21db85" width=".16" height=".16" position=".281 -.238 .02" material="side: double; opacity: .85; transparent: true"></a-plane></a-entity></a-scene><script>const status=document.querySelector('#status'),scene=document.querySelector('a-scene');scene.addEventListener('arReady',()=>status.textContent='Kamera bereit – siehst du die echte Umgebung? Halte danach die Postkarte ins Bild.');scene.addEventListener('arError',()=>status.textContent='Kamerastart fehlgeschlagen. Bitte Berechtigung prüfen.');document.querySelector('#target').addEventListener('targetFound',()=>status.textContent='Postkarte erkannt! Ein grünes Quadrat sollte auf dem blauen Feld erscheinen.');document.querySelector('#target').addEventListener('targetLost',()=>status.textContent='Postkarte nicht erkannt. Kamera weiterhin sichtbar?');</script></body></html>
